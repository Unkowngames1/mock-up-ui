<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POM-2 File Explorer</title>
<style>
:root{color-scheme:dark;--green:#79bd8b;--gold:#c3a66d;--bg:#111715;--panel:#1b2421}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;color:#e1e4dc;background:#101412;font:12px "Lucida Console","Courier New",monospace}.explorer{display:flex;height:100%;border:1px solid #506052;background:var(--bg);box-shadow:inset 0 0 30px #000}.sidebar{width:190px;padding:20px 10px;border-right:1px solid #3c493f;background:#151c19}.brand{margin-bottom:18px;color:var(--gold);font-size:11px}.nav{display:grid;gap:4px}.nav button{height:38px;border:0;border-left:2px solid transparent;color:#9aa99d;background:transparent;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{border-left-color:var(--green);color:#e4eadf;background:#1d2823}.main{flex:1;min-width:0;padding:18px}.toolbar{display:flex;align-items:center;gap:8px;height:38px;margin-bottom:14px;border:1px solid #3e4b42;padding:5px}.toolbar button{height:26px;border:1px solid #536156;color:#cad5cb;background:#202923;cursor:pointer}.toolbar input{flex:1;height:26px;border:1px solid #39473e;color:#d9dfd6;background:#0d120f;padding:0 8px}.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}.file{min-height:92px;padding:12px 8px;border:1px solid transparent;color:#d4dbd2;text-align:center;cursor:pointer}.file:hover,.file.selected{border-color:#77866f;background:#1c2923}.file-icon{display:grid;place-items:center;height:42px;margin-bottom:8px;color:var(--gold);font-size:25px}.status{position:absolute;right:12px;bottom:8px;color:#7f9b84;font-size:9px}@media(max-width:600px){.sidebar{width:58px}.brand,.nav span:last-child{display:none}.nav button{text-align:center}.main{padding:10px}}
</style>
</head>
<body><main class="explorer"><aside class="sidebar"><div class="brand">POM-2 // FILES</div><nav class="nav"><button class="active"><span>▰</span><span> Quick access</span></button><button><span>▤</span><span> Documents</span></button><button><span>◫</span><span> Pictures</span></button><button><span>⌁</span><span> Downloads</span></button><button><span>◉</span><span> This PC</span></button></nav></aside><section class="main"><div class="toolbar"><button id="back">‹</button><button id="forward">›</button><input id="path" value="This PC / Zhaalthur / Documents"><button id="search">⌕</button></div><div class="files"><div class="file selected"><div class="file-icon">▰</div>Archive</div><div class="file"><div class="file-icon">▰</div>Operators</div><div class="file"><div class="file-icon">▰</div>Mission logs</div><div class="file"><div class="file-icon">▤</div>codex.txt</div><div class="file"><div class="file-icon">▤</div>night.log</div><div class="file"><div class="file-icon">◫</div>orrery.png</div></div><span class="status">6 ITEMS · 412 GB FREE</span></section></main><script>document.querySelectorAll(".file").forEach(x=>x.addEventListener("click",()=>{document.querySelectorAll(".file").forEach(y=>y.classList.remove("selected"));x.classList.add("selected")}))</script></body>
</html>
