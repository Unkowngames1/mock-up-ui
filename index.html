<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d18">
  <title>Zhaalthur OS</title>
  <style>
    :root{color-scheme:dark;--gold:#c8a86c;--gold-bright:#ead29a;--teal:#6de0d4;--pearl:#e8e5da;--muted:#91a09c;--line:rgba(200,168,108,.38);--red:#d32d36}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;color:#e7ece9;background:#101719;font-family:"Segoe UI",Arial,sans-serif}button,input{font:inherit}button{color:inherit}
    .desktop{position:relative;isolation:isolate;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 54% 37%,rgba(80,165,157,.16),transparent 34%),radial-gradient(ellipse at 83% 75%,rgba(197,149,83,.08),transparent 28%),linear-gradient(130deg,#1d292b,#11191c 43%,#0c1215)}
    .backdrop-rings{position:absolute;z-index:-1;top:50%;left:50%;width:min(76vw,1000px);aspect-ratio:1;transform:translate(-50%,-48%);border:1px solid rgba(198,169,112,.1);border-radius:50%;box-shadow:0 0 0 36px rgba(198,169,112,.025),0 0 0 90px rgba(109,224,212,.018),inset 0 0 90px rgba(109,224,212,.035)}
    .stone-grain{position:absolute;z-index:-1;inset:0;pointer-events:none;opacity:.15;background:repeating-linear-gradient(7deg,transparent 0 9px,rgba(226,225,209,.025) 10px,transparent 11px)}
    .topbar{position:absolute;z-index:10;inset:0 0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;border-bottom:1px solid rgba(204,190,155,.16);background:rgba(9,14,16,.76);backdrop-filter:blur(18px)}
    .brand,.topbar-left,.topbar-right,.system-stats,.stat,.connection{display:flex;align-items:center}.topbar-left{gap:20px}.brand{gap:10px;color:var(--pearl);font:13px Georgia,serif;letter-spacing:.18em}.brand-symbol{display:grid;place-items:center;width:27px;height:27px;border:1px solid var(--gold);color:var(--gold-bright);clip-path:polygon(50% 0,94% 24%,94% 76%,50% 100%,6% 76%,6% 24%)}.desktop-label{color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.system-stats{height:100%;gap:18px}.stat{gap:8px}.stat-icon{color:var(--teal)}.stat-copy{display:grid;gap:3px}.stat-label{color:var(--muted);font-size:8px;text-transform:uppercase}.stat-value{font-size:10px}.rune-divider{color:rgba(200,168,108,.7)}.topbar-right{gap:15px;color:var(--muted);font-size:10px}.connection{gap:7px}.connection-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 9px var(--teal)}#clock{color:var(--pearl)}
    .shortcuts{position:absolute;z-index:2;top:84px;left:26px;display:grid;gap:17px}.shortcut{width:68px;padding:0;border:0;color:#e7ece9;background:transparent;text-align:center;cursor:pointer}.shortcut-icon{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 7px;border:1px solid rgba(200,168,108,.48);color:var(--teal);background:rgba(17,26,28,.7);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);font-size:17px}.shortcut:hover .shortcut-icon{color:var(--gold-bright);filter:drop-shadow(0 0 7px rgba(109,224,212,.4))}.shortcut-label{display:block;margin-top:6px;font-size:9px;text-shadow:0 1px 5px #000}
    .app-layer{position:absolute;z-index:8;inset:68px 18px 90px;pointer-events:none}.app-window{position:absolute;top:20px;left:50%;display:flex;flex-direction:column;width:min(1050px,calc(100% - 24px));height:min(680px,calc(100% - 24px));overflow:hidden;transform:translateX(-50%);border:1px solid rgba(200,168,108,.55);background:#101719;box-shadow:0 20px 70px #000b;pointer-events:auto}.app-window.maximized{inset:0;width:100%;height:100%;transform:none}.app-window[hidden]{display:none}.app-titlebar{display:flex;align-items:center;justify-content:space-between;flex:0 0 35px;padding:0 8px 0 12px;color:#141711;background:linear-gradient(90deg,#c8c0ab,#a5a18e);cursor:grab;font:bold 10px "Courier New",monospace}.app-titlebar button{width:25px;height:24px;margin-left:4px;border:1px solid #6c6d63;color:#171710;background:#c8c0ab;cursor:pointer}.app-content{flex:1;min-height:0}.app-content iframe{display:block;width:100%;height:100%;border:0;background:#090d18}
    .dock{position:absolute;z-index:10;left:50%;bottom:19px;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 30px);padding:9px 13px;transform:translateX(-50%);border:1px solid rgba(200,168,108,.45);background:rgba(8,14,16,.82);box-shadow:0 12px 40px #0007;backdrop-filter:blur(20px);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}.dock-button{position:relative;display:grid;place-items:center;width:48px;height:48px;border:0;color:var(--muted);background:transparent;cursor:pointer}.dock-hex{display:grid;place-items:center;width:39px;height:39px;border:1px solid var(--gold);color:var(--teal);background:linear-gradient(145deg,rgba(52,70,70,.78),rgba(9,16,18,.9));clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);font-size:16px}.dock-button:hover .dock-hex,.dock-button.active .dock-hex{color:var(--gold-bright);filter:drop-shadow(0 0 6px rgba(109,224,212,.55))}.dock-separator{width:1px;height:31px;background:rgba(200,168,108,.32)}.dock-power{color:#db875e}.tooltip{position:absolute;bottom:56px;left:50%;padding:5px 8px;transform:translateX(-50%);border:1px solid rgba(200,168,108,.3);color:var(--pearl);background:rgba(7,12,14,.95);font-size:9px;white-space:nowrap;opacity:0}.dock-button:hover .tooltip{opacity:1}
    .launcher,.notifications,.power-menu{position:absolute;z-index:30;display:none;border:1px solid var(--line);background:rgba(12,17,27,.97);box-shadow:0 16px 55px #000b}.launcher.visible,.notifications.visible,.power-menu.visible{display:block}.launcher{left:12px;bottom:78px;width:340px;padding:14px}.launcher-head,.panel-head{display:flex;justify-content:space-between;color:var(--gold-bright);font:10px "Courier New",monospace}.close-panel{border:0;background:transparent;color:#aaa;cursor:pointer}.search{width:100%;height:36px;margin:12px 0;padding:0 10px;border:1px solid var(--line);outline:0;color:#eee;background:#090e16}.app-list{display:grid;gap:4px}.app-entry{display:flex;align-items:center;gap:10px;min-height:48px;padding:7px;border:1px solid transparent;background:transparent;text-align:left;cursor:pointer}.app-entry:hover{border-color:var(--line);background:rgba(200,168,108,.06)}.app-entry span:first-child{display:grid;place-items:center;width:32px;height:32px;color:var(--teal);background:#1b2532}.app-entry strong{display:block;font-size:11px}.app-entry small{display:block;margin-top:4px;color:var(--muted);font-size:9px}
    .notifications{right:12px;bottom:78px;width:330px;padding:14px}.notice{padding:12px 4px;border-top:1px solid var(--line);font-size:11px}.notice small{display:block;margin-top:4px;color:var(--muted)}
    .power-menu{right:12px;bottom:78px;width:190px;padding:12px}.power-menu button{display:block;width:100%;padding:9px;border:0;color:#ddd;background:transparent;text-align:left;cursor:pointer}.power-menu button:hover{background:rgba(200,168,108,.08)}
    .login-screen{position:fixed;z-index:60;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50%,rgba(46,63,103,.3),transparent 26rem),rgba(5,8,15,.94);backdrop-filter:blur(9px)}.login-screen.hidden{display:none}.login-card{width:min(360px,calc(100% - 30px));padding:30px;border:1px solid var(--line);background:rgba(13,19,30,.96);box-shadow:0 20px 70px #000b}.login-card h1{margin:8px 0;text-align:center;font-weight:400}.login-mark{color:var(--gold);font:42px Georgia;text-align:center}.login-card label{display:block;margin:12px 0 6px;font-size:10px}.login-card input{width:100%;height:36px;padding:0 10px;border:1px solid var(--line);outline:0;color:#eee;background:#090e16}.login-card button{width:100%;margin-top:18px;padding:11px;border:1px solid rgba(200,168,108,.48);color:#f0dfc0;background:rgba(200,168,108,.11);cursor:pointer}
    .toast{position:absolute;z-index:70;right:18px;bottom:55px;padding:10px 13px;border:1px solid var(--line);background:#111925;opacity:0;pointer-events:none;transform:translateY(7px);transition:.18s}.toast.visible{opacity:1;transform:none}
    @media(max-width:760px){.topbar{padding:0 12px}.desktop-label,.system-stats,.topbar-right .connection{display:none}.shortcuts{top:72px;left:8px}.shortcut{width:54px}.shortcut-icon{width:36px;height:36px}.app-layer{inset:58px 5px 78px}.app-window{top:5px;width:100%;height:calc(100% - 10px)}.dock{gap:2px;padding:7px}.dock-button{width:41px}.dock-hex{width:34px;height:34px}}
  </style>
</head>
<body>
<main class="desktop">
  <div class="backdrop-rings"></div><div class="stone-grain"></div>
  <header class="topbar">
    <div class="topbar-left"><div class="brand"><span class="brand-symbol">ᛟ</span><span>ZHAALTHUR / ORRERY</span></div><span class="rune-divider">ᚱ</span><span class="desktop-label">Operator desktop</span></div>
    <div class="system-stats"><div class="stat"><span class="stat-icon">◈</span><div class="stat-copy"><span class="stat-label">CPU</span><span class="stat-value" id="cpu">24%</span></div></div><span class="rune-divider">ᛉ</span><div class="stat"><span class="stat-icon">▤</span><div class="stat-copy"><span class="stat-label">Memory</span><span class="stat-value">8.4 / 16 GB</span></div></div></div>
    <div class="topbar-right"><div class="connection"><span class="connection-dot"></span>SECURE LINK</div><time id="clock">--:--</time></div>
  </header>
  <nav class="shortcuts">
    <button class="shortcut" data-app="settings" type="button"><span class="shortcut-icon">⚙</span><span class="shortcut-label">Settings</span></button>
    <button class="shortcut" data-app="explorer" type="button"><span class="shortcut-icon">▤</span><span class="shortcut-label">Explorer</span></button>
    <button class="shortcut" data-app="task-manager" type="button"><span class="shortcut-icon">▥</span><span class="shortcut-label">Task Manager</span></button>
  </nav>
  <div class="app-layer" id="appLayer"></div>
  <aside class="launcher" id="launcher"><div class="launcher-head"><span>APPLICATIONS</span><button class="close-panel" data-close="launcher">×</button></div><input class="search" id="appSearch" placeholder="Search applications..."><div class="app-list" id="appList"><button class="app-entry" data-app="settings"><span>⚙</span><span><strong>Settings</strong><small>System and appearance</small></span></button><button class="app-entry" data-app="explorer"><span>▤</span><span><strong>File Explorer</strong><small>Browse mock files</small></span></button><button class="app-entry" data-app="task-manager"><span>▥</span><span><strong>Task Manager</strong><small>Processes and performance</small></span></button></div></aside>
  <aside class="notifications" id="notifications"><div class="panel-head"><span>NOTIFICATIONS</span><button class="close-panel" data-close="notifications">×</button></div><div class="notice">System nominal<small>Zhaalthur services are running.</small></div><div class="notice">Preview mode<small>Settings are simulated in the browser.</small></div></aside>
  <aside class="power-menu" id="powerMenu"><button id="lockButton">ᛁ Lock</button><button data-power="Sleep">◷ Sleep</button><button data-power="Restart">↻ Restart</button><button data-power="Shutdown">⏻ Shut down</button></aside>
  <nav class="dock">
    <button class="dock-button active" id="launcherButton" type="button" aria-label="Launcher"><span class="dock-hex">ᛟ</span><span class="tooltip">Launcher</span></button>
    <button class="dock-button" data-app="explorer" type="button"><span class="dock-hex">▤</span><span class="tooltip">File Explorer</span></button>
    <button class="dock-button" data-app="settings" type="button"><span class="dock-hex">⚙</span><span class="tooltip">Settings</span></button>
    <button class="dock-button" data-app="task-manager" type="button"><span class="dock-hex">▥</span><span class="tooltip">Task Manager</span></button>
    <span class="dock-separator"></span><button class="dock-button" id="notificationButton" type="button"><span class="dock-hex">◉</span><span class="tooltip">Notifications</span></button><button class="dock-button dock-power" id="powerButton" type="button"><span class="dock-hex">⏻</span><span class="tooltip">Power</span></button>
  </nav>
  <section class="login-screen" id="loginScreen"><div class="login-card"><div class="login-mark">ᛟ</div><h1>Welcome back</h1><form id="loginForm"><label>Operator name</label><input id="operatorName" value="NightGuard"><label>Password</label><input type="password" placeholder="Any password for preview"><button type="submit">ENTER SYSTEM →</button></form></div></section>
  <div class="toast" id="toast"></div>
</main>
<script>
const appFiles={settings:{title:"ZHAALTHUR // SETTINGS",path:"./apps/settings.html"},explorer:{title:"POM-2 // FILE MANAGER",path:"./apps/file-explorer.html"},"task-manager":{title:"TASK MANAGER",path:"./apps/task-manager.html"}};
const appLayer=document.getElementById("appLayer"),openWindows=new Map(),launcher=document.getElementById("launcher"),notifications=document.getElementById("notifications"),powerMenu=document.getElementById("powerMenu"),loginScreen=document.getElementById("loginScreen"),toast=document.getElementById("toast");let z=20,toastTimer;
function notify(t){toast.textContent=t;toast.classList.add("visible");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("visible"),2200)}
function updateClock(){const s=new Intl.DateTimeFormat([],{hour:"2-digit",minute:"2-digit"}).format(new Date());document.getElementById("clock").textContent=s;document.getElementById("cpu").textContent=(18+Math.floor(Math.random()*16))+"%"}updateClock();setInterval(updateClock,1000);
function openApp(id){const app=appFiles[id];if(!app)return;if(openWindows.has(id)){const e=openWindows.get(id);e.hidden=false;e.style.zIndex=++z;return}const e=document.createElement("section");e.className="app-window";e.style.zIndex=++z;e.dataset.app=id;const bar=document.createElement("header");bar.className="app-titlebar";bar.innerHTML=`<span>${app.title}</span><span><button data-action="minimize">ᛁ</button><button data-action="maximize">ᛜ</button><button data-action="close">ᚦ</button></span>`;const content=document.createElement("div");content.className="app-content";const iframe=document.createElement("iframe");iframe.src=app.path;iframe.title=app.title;content.appendChild(iframe);e.append(bar,content);appLayer.appendChild(e);openWindows.set(id,e);e.addEventListener("pointerdown",()=>e.style.zIndex=++z);bar.addEventListener("click",ev=>{const action=ev.target.dataset.action;if(!action)return;if(action==="close")e.remove(),openWindows.delete(id);if(action==="minimize")e.hidden=true;if(action=== "maximize")e.classList.toggle("maximized")});launcher.classList.remove("visible")}
document.querySelectorAll("[data-app]").forEach(b=>b.addEventListener("click",()=>openApp(b.dataset.app)));document.getElementById("launcherButton").addEventListener("click",()=>launcher.classList.toggle("visible"));document.getElementById("notificationButton").addEventListener("click",()=>notifications.classList.toggle("visible"));document.getElementById("powerButton").addEventListener("click",()=>powerMenu.classList.toggle("visible"));document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>document.getElementById(b.dataset.close).classList.remove("visible")));document.getElementById("lockButton").addEventListener("click",()=>{powerMenu.classList.remove("visible");loginScreen.classList.remove("hidden")});document.querySelectorAll("[data-power]").forEach(b=>b.addEventListener("click",()=>{powerMenu.classList.remove("visible");if(b.dataset.power=== "Restart"){notify("Restarting browser preview...");setTimeout(()=>location.reload(),900)}else notify(b.dataset.power+" is simulated")}));document.getElementById("loginForm").addEventListener("submit",e=>{e.preventDefault();loginScreen.classList.add("hidden");notify("Welcome, "+document.getElementById("operatorName").value.trim())});document.getElementById("appSearch").addEventListener("input",e=>{const q=e.target.value.toLowerCase();document.querySelectorAll(".app-entry").forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q))});document.addEventListener("keydown",e=>{if(e.key=== "Escape")document.querySelectorAll(".launcher,.notifications,.power-menu").forEach(p=>p.classList.remove("visible"));if((e.ctrlKey||e.metaKey)&&e.key.toLower=== "k"){e.preventDefault();launcher.classList.add("visible");document.getElementById("appSearch").focus()}});
</script>
</body>
</html>
